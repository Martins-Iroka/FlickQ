ktor:
  deployment:
    port: 3000
  application:
    modules:
      - com.martdev.flickq.ApplicationKt.module

database:
  address: ${DB_ADDR}
  maxOpenCons: ${DB_MAX_OPEN_CONNS}
  maxIdleCons: ${DB_MAX_IDLE_CONNS}
  maxIdleTime: ${DB_MAX_IDLE_TIME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

stytch:
  stytchID: ${STYTCH_PROJECT_ID}
  stytchSecret: ${STYTCH_SECRET}

paystack:
  secretKey: ${PAYSTACK_SECRET_KEY}
  publicKey: ${PAYSTACK_PUBLIC_KEY}
  baseUrl: ${PAYSTACK_BASE_URL:https://api.paystack.co}
  callbackUrl: ${PAYSTACK_CALLBACK_URL}
  currency: ${PAYSTACK_CURRENCY:NGN}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  expirationMinutes: ${JWT_EXPIRATION}

cors:
  allowedHosts: ${CORS_ALLOWED_HOSTS:-}
  allowAnyHost: ${CORS_ALLOW_ANY_HOST:false}

cookie:
  secure: ${COOKIE_SECURE:true}
  sameSite: ${COOKIE_SAME_SITE:-Strict}

sentry:
  dsn: ${SENTRY_DNS}
  environment: ${SENTRY_ENVIRONMENT}
  trace_rate: ${SENTRY_TRACES_SAMPLE_RATE}

openTele:
  endpoint: ${OTEL_ENDPOINT}
  api: ${OTEL_API}
  auth: ${OTEL_AUTH}

fcm:
  enabled: ${FCM_ENABLED:false}
  projectId: ${FCM_PROJECT_ID:flickq-124ad}
  credentials: ${FCM_SERVICE_ACCOUNT_B64:-}
  dryRun: ${FCM_DRY_RUN:false}
  topicPrefix: ${FCM_TOPIC_PREFIX:dev-}
  worker:
    batchSize: 100
    concurrency: 16
    pollMs: 1000
    ratePerSecond: ${FCM_RATE_PER_SECOND:500}
    leaseSeconds: 60
  retry:
    baseMs: 5000
    capMs: 3600000
    maxAttempts: ${FCM_RETRY_MAX_ATTEMPTS:8}
  retention:
    sentDays: 7
    deadDays: 30
    tokenStaleDays: 60
    tokenInvalidatedDays: 30

